<!doctype html>
<html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BLOOM 產品手冊</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{--grey:#555;--green:#4fa84f;--line:#8a8a8a}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--grey);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;text-align:center}
.wrap{max-width:960px;margin:0 auto;padding:36px 16px 40px}
.top{text-align:left}.top img{height:44px;display:block}
.wordmark{width:min(540px,90%);margin:34px auto 28px;display:block}
h1{font-size:28px;letter-spacing:.14em;margin:0 0 14px;font-weight:700}
.sub{font-size:20px;margin:0 0 30px;letter-spacing:.05em}
.card{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:center;border:2px solid var(--line);margin-bottom:6px;padding:28px 34px 26px}
.info h2{font-size:27px;margin:0;padding-bottom:26px;border-bottom:1px solid var(--line);font-weight:700}
.info p{margin:0;font-size:17px;line-height:2.2;letter-spacing:.06em}
.info .tag{padding-top:18px}
.pic{display:flex;flex-direction:column;align-items:center;gap:14px}
.pic img{max-width:100%;max-height:200px;width:auto;height:auto}
a.btn{display:inline-block;background:var(--green);color:#fff;text-decoration:none;font-size:20px;padding:6px 34px;border-radius:999px;letter-spacing:.08em}
a.btn:hover{filter:brightness(.92)}a.btn:focus-visible{outline:3px solid #222;outline-offset:2px}
.bot{margin-top:22px}.bot img{height:64px}
@media(max-width:640px){.card{grid-template-columns:1fr;padding:22px 18px}h1{font-size:22px}.sub{font-size:17px}.info h2{font-size:23px}}
</style></head><body><div class="wrap">
<div class="top"><img src="img/logo_top.png" alt="Bloom Planet Group"></div>
<img class="wordmark" src="img/wordmark.png" alt="BLOOM - Your beauty secret">
<h1>探索我們的產品手冊</h1>
<p class="sub">在同一處取得我們的數位產品手冊。</p>
<section class="card"><div class="info"><h2>Hyalu Tox PDRN</h2><p class="tag">Dermotoxin 療程<br>一次解決所有肌膚困擾！</p></div><div class="pic"><img src="img/p_hyalu.png" alt="Hyalu Tox PDRN"><a class="btn" href="pdf/Hyalu_Tox_PDRN_One_page_Brochure_ZH-TW.pdf">繁體中文手冊</a></div></section>
<section class="card"><div class="info"><h2>ACN EXO Shot</h2><p class="tag">針對易長痘與失衡肌膚的<br>外泌體精準護理。</p></div><div class="pic"><img src="img/p_acn.png" alt="ACN EXO Shot"><a class="btn" href="pdf/ACN_Exo_Shot_One_Page_Brochure_ZH-TW.pdf">繁體中文手冊</a></div></section>
<section class="card"><div class="info"><h2>DHT EXO Shot</h2><p class="tag">進階外泌體頭皮護理，<br>讓秀髮更健康。</p></div><div class="pic"><img src="img/p_dht.png" alt="DHT EXO Shot"><a class="btn" href="pdf/DHT_Exo_Shot_One_Page_Brochure_ZH-TW.pdf">繁體中文手冊</a></div></section>
<section class="card"><div class="info"><h2>The POSH Fusion Filler</h2><p class="tag">每一滴，盡顯奢華<br>…簡單，就是美</p></div><div class="pic"><img src="img/p_posh.png" alt="The POSH Fusion Filler"><a class="btn" href="pdf/The_POSH_Fusion_Filler_ZH-TW.pdf">繁體中文手冊</a></div></section>
<section class="card"><div class="info"><h2>One Night Shot</h2><p class="tag">一夜！<br>一針！<br>一次蛻變。</p></div><div class="pic"><img src="img/p_ons.png" alt="One Night Shot"><a class="btn" href="pdf/One_Night_Shot_One_Page_Brochure_ZH-TW.pdf">繁體中文手冊</a></div></section>
<div class="bot"><img src="img/logo_bot.png" alt="Bloom Planet Group"></div>
</div></body></html>
